[package]
name = "plurtfm"
version = "0.1.0"
edition = "2024"


[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1.7"
console_log = "1.0.0"
cratestack-rusqlite = "0.4.9"
log = "0.4.33"
wasm-bindgen = "0.2.125"
wasm-bindgen-futures = "0.4.75"
web-sys = {version = "0.3.102", features = [
    "Window",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "Headers",
]}
