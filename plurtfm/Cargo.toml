[package]
name = "plurtfm"
version = "0.1.0"
edition = "2024"


[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1.7"
console_log = "1.0.0"
log = "0.4.33"
rusqlite = "0.40.1"
serde-wasm-bindgen = "0.6.5"
sqlite-wasm-rs = "0.5.5"
three-d = { version = "0.19.0", default-features = false }
three-d-asset = {version = "0.10.0", features = ["stl"] }
wasm-bindgen = "0.2.125"
wasm-bindgen-futures = "0.4.75"
web-sys = {version = "0.3.102", features = [
    "Window",
    # need for sending rust-js event
    "Event",
    "EventTarget",
    # need for sending custom rust-js events
    "CustomEvent",
    "CustomEventInit",
    # for reading key presses
    "KeyboardEvent",
    # for calculating canvas-space coordinates
    "DomRect","Element",
    "MouseEvent",
]}
